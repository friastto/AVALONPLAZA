# Flyway toma el control
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/global
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial Schema Baseline
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=3000
spring.datasource.hikari.pool-name=AvalonHikariPool

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# =================================
# EXTERNAL SERVICES & SECRETS
