# App Config - Leido desde .env
app.reset-password.url=${APP_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

# =================================
# SPRING AOP CONFIG
# =================================
# Fuerza a Spring a usar CGLIB para que los Aspectos capturen metodos heredados
spring.aop.proxy-target-class=true
# Asegura que la propagacion de aspectos este activa
spring.aop.auto=true

# =================================
# EMAIL (SMTP) CONFIG
# =================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# Registrar en consola cada peticion HTTP que entra a la API
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.suffix=

# =================================
# BREVO EMAIL API CONFIG
# =================================
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL:friastto@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:Avalon App}
