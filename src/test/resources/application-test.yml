spring:
  datasource:
    url: jdbc:h2:mem:avalon_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true # Para que data.sql se ejecute después de ddl-auto

  sql:
    init:
      mode: always
      data-locations: classpath:data-test.sql

# Configuración para manejar tipos GEOMETRY/GEOGRAPHY en H2
# JTS (JTS Topology Suite) es la librería que usa org.locationtech.jts.geom.Point
# Para que H2 pueda almacenar Point, lo mapeamos a VARBINARY.
# Esto es una simulación; no permitirá consultas espaciales complejas en H2.
# Si se necesitaran, se usaría h2gis o alias de funciones.
# Para este ejemplo, asumimos que las pruebas no requieren funcionalidad espacial avanzada en H2.
# No se necesita una configuración explícita aquí si Hibernate puede mapear JTS Point a VARBINARY por defecto.
# Si hubiera problemas, se podría necesitar un TypeContributor o un dialecto personalizado.
# Por ahora, confiamos en que Hibernate lo maneje.
