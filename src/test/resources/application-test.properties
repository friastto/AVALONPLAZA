# ===================================================================
# POSTGRESQL INTEGRATION TEST & TESTCONTAINERS CONFIGURATION
# ===================================================================
spring.test.database.replace=none
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/avalon_integration_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations para entorno de Test
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/global
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true

# ===================================================================
# JWT TEST DEFAULTS
# ===================================================================
app.jwt.secret=QXZhbG9uVGVzdFNlY3JldEtleUZvckNvbnRpbnVvdXNJbnRlZ3JhdGlvbjIwMjZTZWN1cmVITUFDU0hBNTEyS2V5TWluaW11bTY0Qnl0ZXMhIQ==
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# ===================================================================
# AWS & REMOVEBG TEST MOCKS
# ===================================================================
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
removebg.apikey=test-removebg-key

# ===================================================================
# APP RESET PASSWORD URL
# ===================================================================
app.reset-password.url=http://localhost:8900/reset-password

# ===================================================================
# EMAIL (SMTP) DUMMY CONFIG (Evita fallo de MailSenderAutoConfiguration)
# ===================================================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test_user
spring.mail.password=test_pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000

# ===================================================================
# BREVO EMAIL API DUMMY CONFIG
# ===================================================================
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=test-dummy-brevo-api-key
brevo.sender.email=test@avalon.com
brevo.sender.name=Avalon Test

# ===================================================================
# LOGS & SERVER
# ===================================================================
server.tomcat.accesslog.enabled=false
