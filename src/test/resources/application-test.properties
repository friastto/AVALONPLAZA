# PostgreSQL Real / Testcontainers Configuration
spring.test.database.replace=none
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9800/AvalonApi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SoporteAvalonFrias}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:frias}
